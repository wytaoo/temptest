<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顶部导航 + 左侧菜单 · 订单管理</title>
  <!-- Font Awesome 5 免费图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    /* ... 样式保持不变，与之前相同 ... */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f4f7fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- 顶部导航 ---------- */
    .navbar {
      height: 104px;
      background-color: #055AA1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .navbar-logo {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .navbar-logo img {
      display: block;
      max-height: 106px;
      width: auto;
      object-fit: contain;
    }
    .navbar-right {
      display: flex;
      align-items: center;
      gap: 32px;
      height: 100%;
    }
    .nav-tabs {
      display: flex;
      align-items: center;
      list-style: none;
      gap: 28px;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    .nav-tabs li {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .nav-tabs li a {
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.3px;
      transition: color 0.2s ease;
      outline: none;
      user-select: none;
      cursor: default;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
      line-height: 1.2;
    }
    .nav-tabs li a.active {
      color: #ACC83E;
    }
    .nav-tabs li a:hover {
      color: #ACC83E;
    }

    .notification-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #ffffff;
      transition: color 0.2s ease;
      cursor: default;
      width: 20px;
      height: 20px;
      text-decoration: none;
    }
    .notification-icon i {
      font-size: 18px;
    }
    .notification-icon:hover {
      color: #ACC83E;
    }

    .lang-dropdown {
      position: relative;
      display: inline-block;
      cursor: default;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .lang-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-size: 16px;
      transition: color 0.2s ease;
      padding: 4px 0;
      cursor: default;
      user-select: none;
    }
    .lang-trigger i {
      font-size: 16px;
      margin-right: 2px;
    }
    .lang-dropdown:hover .lang-trigger {
      color: #ACC83E;
    }
    .lang-dropdown-menu {
      position: absolute;
      top: calc(70% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      min-width: 120px;
      padding: 8px 0;
      list-style: none;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 100;
      text-align: center;
    }
    .lang-dropdown-menu li {
      padding: 8px 20px;
      font-size: 16px;
      color: #1e2a3a;
      transition: color 0.2s ease;
      cursor: default;
      white-space: nowrap;
    }
    .lang-dropdown-menu li:hover {
      color: #ACC83E;
    }
    .lang-dropdown:hover .lang-dropdown-menu {
      opacity: 1;
      visibility: visible;
    }
    .lang-dropdown-menu::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 6px solid #ffffff;
    }

    .profile-dropdown {
      position: relative;
      display: inline-block;
      cursor: default;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .profile-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 16px;
      transition: color 0.2s ease;
      padding: 4px 0;
      cursor: default;
      user-select: none;
    }
    .profile-trigger i {
      font-size: 16px;
    }
    .profile-trigger .phone-number {
      font-weight: 400;
      letter-spacing: 0.3px;
    }
    .profile-dropdown:hover .profile-trigger {
      color: #ACC83E;
    }
    .profile-dropdown-menu {
      position: absolute;
      top: calc(70% + 8px);
      right: 0;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      min-width: 150px;
      padding: 8px 0;
      list-style: none;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 100;
      text-align: left;
    }
    .profile-dropdown-menu li {
      padding: 8px 20px;
      font-size: 16px;
      color: #1e2a3a;
      transition: color 0.2s ease;
      cursor: default;
      white-space: nowrap;
    }
    .profile-dropdown-menu li:hover {
      color: #ACC83E;
    }
    .profile-dropdown:hover .profile-dropdown-menu {
      opacity: 1;
      visibility: visible;
    }
    .profile-dropdown-menu::before {
      content: '';
      position: absolute;
      top: -6px;
      right: 20px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 6px solid #ffffff;
    }

    /* ---------- 下方色块 ---------- */
    .sub-bar {
      height: 24px;
      background-color: #ACC83E;
      display: flex;
      align-items: center;
      padding-left: 0px;
      flex-shrink: 0;
    }
    .sub-bar img {
      display: block;
      height: 16px;
      width: 158px;
      background-color: rgba(255, 255, 255, 0.35);
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }

    /* ---------- 主体布局 ---------- */
    .app-wrapper {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ---------- 左侧导航 (250px, bg #055AA1) ---------- */
    .sidebar {
      width: 250px;
      background-color: #055AA1;
      flex-shrink: 0;
      padding: 12px 0 20px 5px;
      overflow-y: auto;
      border-right: 1px solid rgba(255,255,255,0.06);
    }

    .menu-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ----- 一级菜单 (240*40) ----- */
    .menu-item {
      width: 240px;
      min-height: 40px;
      background-color: #055AA1;
      border-radius: 8px;
      transition: background-color 0.15s ease;
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: default;
      user-select: none;
      position: relative;
      color: #ffffff;
      font-size: 14px;
      font-weight: 400;
    }
    .menu-item:hover {
      background-color: #ACC83E;
    }
    .menu-item.selectable.active {
      background-color: #ACC83E;
    }
    .menu-item.selectable.active .menu-icon,
    .menu-item.selectable.active .menu-label,
    .menu-item.selectable.active .menu-arrow {
      color: #ffffff;
    }
    .menu-item.has-sub {
      /* 无 active 样式 */
    }
    .menu-item.has-sub:hover {
      background-color: #ACC83E;
    }

    .menu-item .menu-icon {
      width: 20px;
      text-align: center;
      margin-right: 10px;
      font-size: 14px;
      color: #ffffff;
      flex-shrink: 0;
    }
    .menu-item .menu-label {
      flex: 1;
      color: #ffffff;
      font-size: 14px;
      white-space: nowrap;
    }
    .menu-item:hover .menu-icon,
    .menu-item:hover .menu-label {
      color: #ffffff;
    }

    .menu-arrow {
      margin-left: auto;
      font-size: 12px;
      color: #ffffff;
      flex-shrink: 0;
      width: 16px;
      text-align: center;
    }
    .menu-item.no-arrow .menu-arrow {
      visibility: hidden;
    }

    /* ----- 二级菜单 ----- */
    .sub-menu-wrapper {
      position: relative;
      padding-left: 0;
    }

    .sub-menu-wrapper::before {
      content: '';
      position: absolute;
      left: 22px;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
      border-radius: 1px;
    }

    .sub-menu {
      list-style: none;
      margin: 0;
      padding: 0;
      padding-left: 42px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background-color: transparent;
      margin-top: 4px;
    }

    .sub-menu-item {
      width: 190px;
      min-height: 38px;
      height: 38px;
      background-color: #055AA1;
      border-radius: 8px;
      transition: background-color 0.15s ease;
      display: flex;
      align-items: center;
      cursor: default;
      user-select: none;
      color: #ffffff;
      font-size: 14px;
      position: relative;
      margin-left: -8px;
      padding-left: 8px;
    }
    .sub-menu-item:hover {
      background-color: #ACC83E;
    }
    .sub-menu-item.active {
      background-color: #ACC83E;
    }
    .sub-menu-item.active .sub-label {
      color: #ffffff;
    }

    .sub-menu-item .sub-label {
      color: #ffffff;
      font-size: 14px;
      display: flex;
      align-items: center;
    }
    .sub-menu-item:hover .sub-label {
      color: #ffffff;
    }

    /* ---------- 右侧主内容 ---------- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f0f4fa;
      padding: 0;
      overflow: hidden;
    }

    .tab-bar {
      height: 44px;
      background: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #e6edf4;
      flex-shrink: 0;
      overflow-x: auto;
      gap: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .tab-item {
      display: inline-flex;
      align-items: center;
      height: 100%;
      padding: 0 12px;
      font-size: 13px;
      color: #1e2a3a;
      background: transparent;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      cursor: default;
      user-select: none;
      transition: border-color 0.15s ease, color 0.15s ease;
      position: relative;
      gap: 8px;
    }
    .tab-item.active {
      border-bottom-color: #055AA1;
      color: #055AA1;
      font-weight: 500;
    }
    .tab-item .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      font-size: 12px;
      color: #8c9aa8;
      cursor: default;
      transition: background 0.15s ease, color 0.15s ease;
      margin-left: 4px;
    }
    .tab-item .tab-close:hover {
      background: #eef3f8;
      color: #1e2a3a;
    }
    .tab-item .tab-close i {
      font-size: 12px;
      pointer-events: none;
    }
    .tab-item.home-tab .tab-close {
      display: none;
    }

    /* ============================================================
       内容区域 - 内边距 16px
       ============================================================ */
    .tab-content-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      background: #ffffff;
      color: #1e2a3a;
    }

    /* ========== 订单管理搜索组件样式（修改版） ========== */
    .search-card {
    
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px 24px;
    }

    .search-fields {
      flex: 1 1 0;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px 24px;
      min-width: 0;
    }

    .date-field-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .date-field-row .date-range-wrapper {
      width: 260px;
      min-width: 260px;
    }
    .date-field-row .field-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }
    .date-field-row .field-actions .btn {
      width: 60px;
      height: 36px;
      padding: 0;
      justify-content: center;
      flex-shrink: 0;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 140px;
      flex: 0 1 auto;
    }
    .field-group label {
      font-size: 14px;
      font-weight: 500;
      color: #4a5363;
    }

    .field-group.wide {
      flex: 0 1 380px;
      min-width: 160px;
      max-width: 380px;
    }

    .input-field {
      width: 100%;
      padding: 9px 14px;
      border: 1px solid #cbd0d9;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: white;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      color: #1a2232;
    }
    .input-field:focus {
      border-color: #055AA1;
      box-shadow: 0 0 0 3px rgba(5, 90, 161, 0.10);
    }
    textarea.input-field {
      min-height: 112px;
      resize: vertical;
    }

    .date-range-wrapper {
      position: relative;
      width: 260px;
      min-width: 260px;
    }
    .date-range-display {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 36px 0 10px;
      border: 1px solid #cbd0d9;
      border-radius: 8px;
      background: white;
      height: 36px;
      font-size: 14px;
      color: #9aa1ad;
      cursor: pointer;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      position: relative;
      width: 100%;
      white-space: nowrap;
    }
    .date-range-display.has-date { color: #1a2232; }
    .date-range-display.active {
      border-color: #055AA1;
      box-shadow: 0 0 0 3px rgba(5, 90, 161, 0.10);
    }
    .date-range-display .range-icon {
      color: #9aa1ad;
      font-size: 15px;
      margin-right: 8px;
      flex-shrink: 0;
      pointer-events: none;
    }
    .date-range-display .clear-icon {
      position: absolute;
      right: 10px;
      color: #9aa1ad;
      font-size: 13px;
      cursor: pointer;
      display: none;
      line-height: 1;
    }
    .date-range-display.has-date .clear-icon { display: inline-block; }
    .date-range-display .clear-icon:hover { color: #055AA1; }
    .date-range-panel {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 520px;
      background: white;
      border: 1px solid #e2e6ec;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.10);
      padding: 18px 20px 20px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px) scale(0.96);
      transition: opacity 0.2s, transform 0.2s, visibility 0s 0.2s;
    }
    .date-range-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    /* ====== 异常原因多选下拉 ====== */
    .multi-select-wrapper {
      position: relative;
      width: 260px;
      min-width: 260px;
    }
    /* 查询/重置 紧跟在制单日期后面（同一行） */
    .date-row-inline {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .date-row-inline .field-actions {
      margin-top: 0;
      flex-shrink: 0;
    }
    /* 异常原因：独占一行，保留标题 */
    .reason-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 12px;
    }
    .reason-field label {
      font-size: 14px;
      font-weight: 500;
      color: #4a5363;
    }
    .multi-select-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px 0 10px;
      border: 1px solid #cbd0d9;
      border-radius: 8px;
      background: white;
      height: 36px;
      font-size: 14px;
      color: #9aa1ad;
      cursor: pointer;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }
    .multi-select-display.has-value { color: #1a2232; }
    .multi-select-display.active {
      border-color: #055AA1;
      box-shadow: 0 0 0 3px rgba(5, 90, 161, 0.10);
    }
    .multi-select-display .ms-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .multi-select-display .ms-arrow {
      position: absolute;
      right: 10px;
      color: #9aa1ad;
      font-size: 12px;
      transition: transform 0.2s;
    }
    .multi-select-display.active .ms-arrow { transform: rotate(180deg); }
    .multi-select-panel {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      min-width: 220px;
      background: white;
      border: 1px solid #e2e6ec;
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.10);
      padding: 10px 12px;
      box-sizing: border-box;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s, visibility 0s 0.2s;
    }
    .multi-select-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .multi-select-panel .ms-actions {
      display: flex;
      gap: 12px;
      padding-bottom: 8px;
      margin-bottom: 6px;
      border-bottom: 1px solid #eef1f5;
    }
    .multi-select-panel .ms-link {
      font-size: 13px;
      color: #055AA1;
      cursor: pointer;
      user-select: none;
    }
    .multi-select-panel .ms-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .multi-select-panel .ms-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #1a2232;
      cursor: pointer;
      padding: 4px 2px;
      border-radius: 6px;
    }
    .multi-select-panel .ms-option:hover { background: #f5f9fd; }
    /* 隐藏单选图标，用整行高亮表示选中 */
    .multi-select-panel .ms-option input {
      display: none;
    }
    .multi-select-panel .ms-option.active {
      background: rgba(5, 90, 161, 0.08);
      color: #055AA1;
      font-weight: 500;
    }
    .dp-months { display: flex; gap: 20px; }
    .dp-month { flex: 1; }
    .dp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .dp-header .dp-nav {
      background: transparent;
      border: none;
      font-size: 16px;
      color: #6f7887;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .dp-header .dp-nav:hover { background: #f0f4fa; color: #055AA1; }
    .dp-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: #9aa1ad;
      margin-bottom: 6px;
    }
    .dp-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .dp-day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.15s;
      color: #1a2232;
    }
    .dp-day:hover { background: #f0f4fa; }
    .dp-day.selected {
      background: #055AA1;
      color: white;
      font-weight: 500;
    }
    .dp-day.other-month { color: #cbd0d9; }
    .dp-day.in-range {
      background: rgba(5, 90, 161, 0.10);
      border-radius: 0;
    }

    .btn {
      padding: 9px 20px;
      border-radius: 8px;
      border: 1px solid #cbd0d9;
      background: white;
      font-size: 14px;
      font-weight: 500;
      color: #4a5363;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      white-space: nowrap;
      height: 40px;
    }
    .btn-primary {
      background: #055AA1;
      border-color: #055AA1;
      color: white;
    }
    .btn-primary:hover { background: #043f73; border-color: #043f73; }
    .btn:hover { border-color: #055AA1; color: #055AA1; }
    .btn-primary:hover { color: white; }

    /* ====== 表格组件样式（从表格.html 移植） ====== */
    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e2e6ec;
    }
    .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .table-wrap th {
      background: #f9fafc;
      color: #4a5363;
      font-weight: 600;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #e2e6ec;
      white-space: nowrap;

        const subItem = document.querySelector(`.sub-menu-item[data-menu="${menuName}"]`);
        if (subItem) return subItem;
        const menuItem = document.querySelector(`.menu-item.selectable[data-menu="${menuName}"]`);
        return menuItem || null;

        document.querySelectorAll('.menu-item, .sub-menu-item').forEach(item => item.classList.remove('active'));

        if (target) {

      function setActiveTab(tabEl) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        tabEl.classList.add('active');

        const tabName = tabEl.dataset.tab;
        if (tabName && contentMap[tabName]) {
          contentArea.innerHTML = contentMap[tabName];
          if (tabName === '异常单管理') {
            initOrderManagement();
          }
        } else {
          contentArea.innerHTML = `<div style="background:white; padding:20px; border-radius:12px;"><p>${tabName || '未知'}</p></div>`;
        }

        highlightMenu(tabName);
      }

      function closeTab(tabEl) {
        if (tabEl.classList.contains('home-tab')) return;
        const nextTab = tabEl.nextElementSibling || tabEl.previousElementSibling;
        tabEl.remove();
        if (nextTab) {
          setActiveTab(nextTab);
        } else if (tabBar.children.length > 0) {
          setActiveTab(tabBar.children[0]);
        } else {
          createHomeTab();
        }
      }

      function createHomeTab() {
        const homeTab = document.createElement('div');
        homeTab.className = 'tab-item active home-tab';
        homeTab.dataset.tab = '首页';
        homeTab.innerHTML = '<span>首页</span><span class="tab-close"><i class="fas fa-times"></i></span>';
        tabBar.appendChild(homeTab);
        setActiveTab(homeTab);
        bindTabEvents(homeTab);
      }

      function bindTabEvents(tab) {
        const closeBtn = tab.querySelector('.tab-close');
        if (closeBtn) {
          closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeTab(tab);
          });
        }
        tab.addEventListener('click', function(e) {
          if (e.target.closest('.tab-close')) return;
          setActiveTab(this);
        });
      }

      function openTab(menuName) {
        let existTab = null;
        for (let child of tabBar.children) {
          if (child.dataset.tab === menuName) {
            existTab = child;
            break;
          }
        }
        if (existTab) {
          setActiveTab(existTab);
          return;
        }
        const tab = document.createElement('div');
        tab.className = 'tab-item';
        tab.dataset.tab = menuName;
        tab.innerHTML = `<span>${menuName}</span><span class="tab-close"><i class="fas fa-times"></i></span>`;
        tabBar.appendChild(tab);
        setActiveTab(tab);
        bindTabEvents(tab);
      }

      function syncExtraPanels() {

        if (!sel || !input) return;
        const v = sel.value;
        const needInput = v === '门禁密码' || v === '给派送员留言';

      // 自定义下拉：把隐藏 select 的值同步到触发按钮文本与选中态
      function updateExtraSelectUI() {
        const sel = document.getElementById('solExtraSelect');
        const text = document.getElementById('solExtraText');
        const list = document.getElementById('solExtraList');
        if (!sel || !text || !list) return;
        const v = sel.value;
        const opt = list.querySelector('.cs-option[data-value="' + v + '"]');
        text.textContent = opt ? opt.textContent : '无';
        list.querySelectorAll('.cs-option').forEach(o => {
          o.classList.toggle('selected', o.getAttribute('data-value') === v);
        });

      // 初始化辅助派送自定义下拉交互
      function initExtraCustomSelect() {
        const wrap = document.getElementById('solExtraCustom');
        const trigger = document.getElementById('solExtraTrigger');
        const list = document.getElementById('solExtraList');
        const sel = document.getElementById('solExtraSelect');
        if (!wrap || !trigger || !list || !sel) return;
        const options = list.querySelectorAll('.cs-option');
        trigger.addEventListener('click', function(e) {
          e.stopPropagation();
          wrap.classList.toggle('open');
        });
        options.forEach(li => {
          li.addEventListener('click', function(e) {
            e.stopPropagation();
            const v = li.getAttribute('data-value');
            sel.value = v;
            updateExtraSelectUI();
            wrap.classList.remove('open');
            sel.dispatchEvent(new Event('change'));
          });
        });
        document.addEventListener('click', function(e) {
          if (wrap && !wrap.contains(e.target)) wrap.classList.remove('open');
        });
      }

      // 新地址重派表单：原派件信息只读回显，新派件信息清空必填
      function fillSolAddrForm(data) {
        const setVal = (id, v) => {
          const el = document.getElementById(id);
          if (el) el.value = v == null ? '' : v;
        };
        const setOrig = (id, v) => {
          const el = document.getElementById(id);
          if (el) el.textContent = (v == null || v === '') ? '-' : v;
        };
        const full = ((data && data.address) || '').trim();
        const parts = full.split(',').map(s => s.trim());
        let street = parts[0] || full;
        let city = '', state = '', postcode = '';
        if (parts.length > 1) city = parts[1] || '';
        if (parts.length > 2) {
          const sp = parts[2].split(/\s+/);
          postcode = sp.length > 1 ? sp[sp.length - 1] : '';
          state = sp.length > 1 ? sp.slice(0, -1).join(' ') : parts[2];
        }
        // 原派件信息（只读回显）
        setOrig('solOrigName', data && data.receiverName);
        setOrig('solOrigPhone', data && data.receiverPhone);
        setOrig('solOrigCountry', 'United States');
        setOrig('solOrigState', state);
        setOrig('solOrigCity', city);
        setOrig('solOrigPostcode', postcode);
        setOrig('solOrigAddress', street);
        // 新派件信息（清空，用户填写；国家默认 USA，可修改）
        setVal('solAddrName', '');
        setVal('solAddrPhone', '');
        setVal('solAddrCountry', 'USA');
        setVal('solAddrState', '');
        setVal('solAddrCity', '');
        setVal('solAddrPostcode', '');
        setVal('solAddrLine2', '');
      }

        updateText();
        renderAll();

        // =============================================================
        // ====== 表格核心函数 ======
        // =============================================================

        function getOrderFilteredData() {
          let filtered = orderDataGlobal;
          
          // 按状态过滤
          if (orderCurrentFilterGlobal !== '全部') {
            filtered = filtered.filter(d => d.status === orderCurrentFilterGlobal);
          }
          
          // 按单号查询过滤
          if (searchParams.orderNos) {
            const keywords = searchParams.orderNos.split(/[,，\n\s]+/).filter(k => k.trim());
            if (keywords.length > 0) {
              filtered = filtered.filter(d => {
                return keywords.some(k => 
                  d.orderNo.includes(k) || d.trackingNo.includes(k)
                );
              });
            }
          }
          
          // 按日期范围过滤
          if (searchParams.startDate && searchParams.endDate) {
            filtered = filtered.filter(d => {
              return d.createDate >= searchParams.startDate && d.createDate <= searchParams.endDate;
            });
          }

          // 按创建时间范围过滤（按日期部分比较，未选=不过滤）
          if (searchParams.createTimeStart && searchParams.createTimeEnd) {
            filtered = filtered.filter(d => {
              const ct = (d.createTime || '').slice(0, 10);
              return ct >= searchParams.createTimeStart && ct <= searchParams.createTimeEnd;
            });
          }
          
          // 排序（制单日期 / 创建时间 / 截止时间 / 异常原因）
          if (orderSortKeyGlobal) {
            const dir = orderSortDirGlobal === 'asc' ? 1 : -1;
            filtered = filtered.slice().sort((a, b) => {
              const va = a[orderSortKeyGlobal] == null ? '' : String(a[orderSortKeyGlobal]);
              const vb = b[orderSortKeyGlobal] == null ? '' : String(b[orderSortKeyGlobal]);
              return va.localeCompare(vb, 'zh-Hans-CN') * dir;
            });
          }
          
          return filtered;
        }

        function getOrderTotalPages() {
          return Math.ceil(orderTotalItemsGlobal / orderPageSizeGlobal) || 1;
        }

        function getOrderCurrentPageData() {
          const filtered = getOrderFilteredData();
          orderTotalItemsGlobal = filtered.length;
          const totalPages = getOrderTotalPages();
          if (orderCurrentPageGlobal > totalPages) orderCurrentPageGlobal = totalPages || 1;
          const start = (orderCurrentPageGlobal - 1) * orderPageSizeGlobal;
          const end = start + orderPageSizeGlobal;
          return filtered.slice(start, end);
        }

        function renderOrderTable() {
          const pageData = getOrderCurrentPageData();
          const tbody = document.getElementById('orderTableBody');
          const thead = document.getElementById('orderTableHead');
          if (!tbody || !thead) return;

          // 构建表头（所有tab一致）
          const headers = ['订单号', '运单号', '异常原因', '派送次数', '制单仓', '制单日期', '创建时间', '截止时间', '处理状态', '工单号', '操作'];
          const sortableMap = {
            '异常原因': 'abnormalReason',
            '制单日期': 'createDate',
            '创建时间': 'createTime',
            '截止时间': 'deadlineTime'
          };
          const thStyle = 'background:#f9fafc; color:#4a5363; font-weight:600; padding:10px 14px; text-align:left; border-bottom:1px solid #e2e6ec; white-space:nowrap;';
          let headerHtml = '<tr>' + headers.map((h, i) => {
            const key = sortableMap[h];
            if (!key) {
              return `<th${i === headers.length - 1 ? ' class="sticky-right-head"' : ''} style="${thStyle}">${h}</th>`;
            }
            const isActive = orderSortKeyGlobal === key;
            const icon = isActive ? (orderSortDirGlobal === 'asc' ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort';
            return `<th class="sortable${isActive ? ' sorted' : ''}" data-sort="${key}" style="${thStyle}">${h}<i class="fas ${icon} sort-icon"></i></th>`;
          }).join('') + '</tr>';
          thead.innerHTML = headerHtml;

          // 渲染行
          let bodyHtml = '';
          if (pageData.length === 0) {
            bodyHtml = `<tr><td colspan="11" style="text-align:center;padding:40px 0;color:#9aa1ad;">暂无数据</td></tr>`;
          } else {
            pageData.forEach(item => {
              const solJson = JSON.stringify({
                orderNo: item.orderNo,
                trackingNo: item.trackingNo,
                abnormalReason: item.abnormalReason,
                warehouse: item.warehouse,
                createDate: item.createDate,
                createTime: item.createTime,
                deadlineTime: item.deadlineTime,
                status: item.status,
                workOrderNo: item.workOrderNo,
                deliveryCount: item.deliveryCount,
                address: item.address,
                receiverName: item.receiverName,
                receiverPhone: item.receiverPhone,
                remark: item.remark
              }).replace(/"/g, '&quot;');
              const handled = item.status === '已处理';
              const solText = handled ? '变更' : '处理';
              // 指定单号（UL455773495YP001）变更时拦截提示
              const changeBlocked = handled && item.orderNo === 'UL455773495YP001';
              const solBtn = changeBlocked
                ? `<button class="action-btn primary text" onclick="window.showChangeBlockAlert()">${solText}</button>`
                : `<button class="action-btn primary text" data-sol='${solJson}' onclick="window.openSolutionModal(JSON.parse(this.dataset.sol), ${handled})">${solText}</button>`;
              bodyHtml += `
                <tr>
                  <td>${item.orderNo}</td>
                  <td>${item.trackingNo}</td>
                  <td>${item.abnormalReason}</td>
                  <td>${item.deliveryCount}</td>
                  <td>${item.warehouse}</td>
                  <td>${item.createDate}</td>
                  <td>${item.createTime.slice(0, 10)}</td>
                  <td>${item.deadlineTime.slice(0, 10)}</td>
                  <td>${item.status}</td>
                  <td>${item.workOrderNo}</td>
                  <td class="sticky-right-cell">
                    ${solBtn}
                    ${handled ? `<button class="action-btn primary text" style="margin-left:10px;" onclick="window.openRecordModal('${item.orderNo}')">记录</button>` : ''}
                  </td>
                </tr>`;
            });
          }
          tbody.innerHTML = bodyHtml;

          updateOrderPaginationUI();
          updateTabCounts();
        }

        // ====== 订单分页器 ======
        function updateOrderPaginationUI() {
          const totalPages = getOrderTotalPages();
          const totalInfo = document.getElementById('orderTotalInfo');
          const pageBtns = document.getElementById('orderPageBtns');
          if (totalInfo) totalInfo.textContent = `共 ${orderTotalItemsGlobal} 条`;
          if (!pageBtns) return;

          let btnHtml = '';
          btnHtml += `<button class="page-btn" data-page="prev" ${orderCurrentPageGlobal <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;
          let startPage = Math.max(1, orderCurrentPageGlobal - 3);
          let endPage = Math.min(totalPages, startPage + 6);
          if (endPage - startPage < 6) startPage = Math.max(1, endPage - 6);
          for (let p = startPage; p <= endPage; p++) {
            btnHtml += `<button class="page-btn ${p === orderCurrentPageGlobal ? 'active' : ''}" data-page="${p}">${p}</button>`;
          }
          btnHtml += `<button class="page-btn" data-page="next" ${orderCurrentPageGlobal >= totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
          pageBtns.innerHTML = btnHtml;

          pageBtns.querySelectorAll('.page-btn:not([disabled])').forEach(btn => {
            btn.addEventListener('click', function() {
              if (this.disabled) return;
              const p = this.dataset.page;
              if (p === 'prev' && orderCurrentPageGlobal > 1) { orderCurrentPageGlobal--; renderOrderTable(); }
              else if (p === 'next' && orderCurrentPageGlobal < totalPages) { orderCurrentPageGlobal++; renderOrderTable(); }
              else if (!isNaN(p)) { orderCurrentPageGlobal = parseInt(p); renderOrderTable(); }
            });
          });

          const gotoInput = document.getElementById('orderGotoInput');
          if (gotoInput) {
            gotoInput.value = orderCurrentPageGlobal;
            gotoInput.max = totalPages || 1;
          }
        }

        // ====== 订单TAB切换 ======
        document.querySelectorAll('.order-tab-item').forEach(btn => {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.order-tab-item').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const tabText = this.textContent.trim();
            const match = tabText.match(/^([^\s]+)/);
            orderCurrentFilterGlobal = match ? match[1] : '全部';
            selectedOrderIdsGlobal.clear();
            orderCurrentPageGlobal = 1;
            renderOrderTable();
          });
        });

        // ====== 表头排序（异常原因/制单日期/创建时间/截止时间） ======
        const orderThead = document.getElementById('orderTableHead');
        if (orderThead) {
          orderThead.addEventListener('click', function(e) {
            const th = e.target.closest('th.sortable');
            if (!th) return;
            const key = th.getAttribute('data-sort');
            if (!key) return;
            if (orderSortKeyGlobal === key) {
              // 同一列：升序 -> 降序 -> 取消排序
              if (orderSortDirGlobal === 'asc') {
                orderSortDirGlobal = 'desc';
              } else {
                orderSortKeyGlobal = '';
                orderSortDirGlobal = 'asc';
              }
            } else {
              orderSortKeyGlobal = key;
              orderSortDirGlobal = 'asc';
            }
            orderCurrentPageGlobal = 1;
            renderOrderTable();
          });
        }

        // ====== 分页器事件绑定 ======
        const pageSizeSelect = document.getElementById('orderPageSizeSelect');
        if (pageSizeSelect) {
          pageSizeSelect.addEventListener('change', function() {
            orderPageSizeGlobal = parseInt(this.value);
            orderCurrentPageGlobal = 1;
            selectedOrderIdsGlobal.clear();
            renderOrderTable();
          });
        }

        const gotoBtn = document.getElementById('orderGotoBtn');
        const gotoInput = document.getElementById('orderGotoInput');
        if (gotoBtn && gotoInput) {
          gotoBtn.addEventListener('click', function() {
            const val = parseInt(gotoInput.value);
            const totalPages = getOrderTotalPages();
            if (!isNaN(val) && val >= 1 && val <= totalPages) {
              orderCurrentPageGlobal = val;
              selectedOrderIdsGlobal.clear();
              renderOrderTable();
            } else {
              alert(`请输入 1 ~ ${totalPages} 之间的页码`);
            }
          });
          gotoInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') gotoBtn.click();
          });
        }

        // ====== 初始化渲染 ======
        renderOrderTable();
        console.log('✅ 订单管理表格已加载（POD弹窗修复版）');
      }

      // ============================================================
      // 左侧菜单点击
      // ============================================================
      document.querySelectorAll('.menu-item.selectable').forEach(el => {
        el.addEventListener('click', function(e) {
          e.preventDefault();
          const menuName = this.dataset.menu || this.querySelector('.menu-label')?.textContent.trim();
          if (!menuName) return;
          document.querySelectorAll('.menu-item, .sub-menu-item').forEach(item => item.classList.remove('active'));
          this.classList.add('active');
          openTab(menuName);
        });
      });

      document.querySelectorAll('.sub-menu-item').forEach(el => {
        el.addEventListener('click', function(e) {
          e.preventDefault();
          const menuName = this.dataset.menu || this.querySelector('.sub-label')?.textContent.trim();
          if (!menuName) return;
          document.querySelectorAll('.menu-item, .sub-menu-item').forEach(item => item.classList.remove('active'));
          this.classList.add('active');
          openTab(menuName);
        });
      });

      // ============================================================
      // 初始化 - 默认打开异常单管理
      // ============================================================
      const defaultHomeTab = document.querySelector('.tab-item.home-tab');
      if (defaultHomeTab) {
        // 默认打开异常单管理
        openTab('异常单管理');
      } else {
        createHomeTab();
      }
    })();
  </script>
</body>
</html>
